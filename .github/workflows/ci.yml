name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu cpio

      # Installs toolchain, components and targets from rust-toolchain.toml
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Format
        run: make fmt-check

      - name: Clippy x86-64
        run: make clippy CLIPPY_FLAGS="-D warnings"

      - name: Clippy aarch64
        run: make clippy-arm CLIPPY_FLAGS="-D warnings"

      - name: Build x86-64 (kernel + userspace)
        run: make build user

      - name: Unit tests (host x86-64)
        run: make test

      - name: Build aarch64 (kernel + userspace)
        run: make build-arm

  boot-x86:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # /dev/kvm is not writable by the runner user, so QEMU uses TCG
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 grub-pc-bin grub-common xorriso mtools dosfstools cpio

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Boot test x86-64
        run: make check

      - name: Upload serial log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-x86
          path: /tmp/qemu_serial.log
          if-no-files-found: ignore

  boot-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Native arm64: the host gcc/binutils provide the aarch64-linux-gnu-*
      # names used by kernel/build.rs and user/.cargo/config.toml
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils qemu-system-arm mtools dosfstools cpio

      - name: Install rustup (if missing)
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Boot test aarch64
        run: make check-arm

      # After check-arm: the aarch64 kernel include_bytes!()s the initramfs
      - name: Unit tests (host arm64)
        run: make test

      - name: Upload serial log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-arm
          path: /tmp/qemu_serial_arm.log
          if-no-files-found: ignore
