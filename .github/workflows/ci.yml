name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu cpio

      # Installs toolchain, components and targets from rust-toolchain.toml
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Format
        run: make fmt-check

      - name: Clippy x86-64
        run: make clippy CLIPPY_FLAGS="-D warnings"

      - name: Clippy aarch64
        run: make clippy-arm CLIPPY_FLAGS="-D warnings"

      - name: Build x86-64 (kernel + userspace)
        run: make build user

      - name: Unit tests (host x86-64)
        run: make test

      - name: Build aarch64 (kernel + userspace)
        run: make build-arm

  boot-x86:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # /dev/kvm is not writable by the runner user, so QEMU uses TCG
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 grub-pc-bin grub-common xorriso mtools dosfstools fdisk cpio

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Boot test x86-64
        run: make check

      # The default NIC is virtio-net; keep the e1000 driver covered too
      - name: Boot test x86-64 (e1000 NIC)
        run: make check NIC=e1000

      - name: Upload serial log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-x86
          path: target/qemu/serial.log
          if-no-files-found: ignore

      # Differential run of boot_tester on Ubuntu's Linux kernel (TCG here,
      # hence the long timeout).
      - name: Boot test on Linux (x86-64)
        id: linux_x86
        run: make check-linux LINUX_TEST_TIMEOUT=300

      - name: Upload Linux serial log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-linux-x86
          path: target/qemu/serial_linux_x86_64.log
          if-no-files-found: ignore

  boot-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Native arm64: the host gcc/binutils provide the aarch64-linux-gnu-*
      # names used by kernel/build.rs and user/.cargo/config.toml
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils qemu-system-arm mtools dosfstools fdisk cpio

      - name: Install rustup (if missing)
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Boot test aarch64
        run: make check-arm

      - name: Boot test aarch64 (e1000 NIC)
        run: make check-arm NIC=e1000

      # After check-arm: the aarch64 kernel include_bytes!()s the initramfs
      - name: Unit tests (host arm64)
        run: make test

      - name: Upload serial log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-arm
          path: target/qemu/serial_arm.log
          if-no-files-found: ignore

      # Differential run on Ubuntu's arm64 Linux kernel (kernel .deb comes
      # from apt-get download; apt lists were updated above).
      - name: Boot test on Linux (aarch64)
        id: linux_arm
        run: make check-linux LINUX_TEST_TIMEOUT=300

      - name: Upload Linux serial log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-linux-arm
          path: target/qemu/serial_linux_aarch64.log
          if-no-files-found: ignore
