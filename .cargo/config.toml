# Build configuration for hk kernel
#
# To build for bare metal:
#   cargo build --target x86_64-unknown-none
#
# To run tests (uses host target automatically):
#   cargo test

[target.x86_64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C", "code-model=kernel",
    "-C", "relocation-model=static",
    # x86-64 LLVM 23 drops the prologue of a function whose stack-
    # realigned local follows an early return when it shrink-wraps
    # (rust-lang/rust#165958): off until fixed
    "-C", "llvm-args=-enable-shrink-wrap=false",
]

# The linker script comes from build.rs
[target.aarch64-unknown-none-softfloat]
linker = "rust-lld"
