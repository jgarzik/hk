# The hk kernel crate (its sources are the repo root's .rs files and
# module directories) and the workspace it heads
[package]
name = "hk-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "hk kernel - main kernel crate"

[[bin]]
name = "kernel"
path = "main.rs"

[dependencies]
spin.workspace = true
bitflags.workspace = true

[features]
default = []
# Lockdep-lite: spin-lock tracking, lock order and sleep-in-atomic checks
# (debug aid; `make check LOCKDEP=1`); includes mmcheck
lockdep = ["mmcheck"]
# VMA/PTE agreement check after each address-range operation
# (`mm::check`, MMCHECK:FAIL reports; debug aid)
mmcheck = []

[lints]
workspace = true

[workspace]
resolver = "2"
exclude = [
    "user",   # Separate target (Linux userspace, not bare metal)
    "tools",  # Host-side tools, built separately
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Shared dependencies across workspace
spin = "0.9"
bitflags = "2"

# doc/UNSAFE.md. The gate runs clippy with -D warnings: warn = deny there.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
static_mut_refs = "deny"
unused_unsafe = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
new_without_default = "allow"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
mut_mut = "warn"
cast_lossless = "warn"
as_underscore = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
as_ptr_cast_mut = "warn"
ref_as_ptr = "warn"
borrow_as_ptr = "warn"
ignored_unit_patterns = "warn"
needless_bitwise_bool = "warn"
no_mangle_with_rust_abi = "warn"
float_arithmetic = "warn"
