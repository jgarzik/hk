[workspace]
resolver = "2"
members = [
    "kernel",
]
exclude = [
    "user",   # Separate target (Linux userspace, not bare metal)
    "tools",  # Host-side tools, built separately
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Shared dependencies across workspace
spin = "0.9"
bitflags = "2"

# doc/UNSAFE.md. The gate runs clippy with -D warnings: warn = deny there.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
static_mut_refs = "deny"
unused_unsafe = "deny"

[workspace.lints.clippy]
missing_safety_doc = "deny"
mut_mut = "warn"
